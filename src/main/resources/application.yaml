logging:
  level:
    root: INFO
    com.byh.groupware: DEBUG
    org.hibernate.SQL: DEBUG
    # Spring Boot 3.x (Hibernate 6) 기준 SQL 바인딩 파라미터 확인:
    org.hibernate.orm.jdbc.bind: TRACE
    # Spring Boot 2.x (Hibernate 5)인 경우 아래 주석 해제:
    # org.hibernate.type.descriptor.sql: TRACE
    org.springframework.web: DEBUG
