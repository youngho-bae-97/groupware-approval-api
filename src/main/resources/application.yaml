logging:
  level:
    root: info
    com.byh.groupware: debug          # 내 패키지 로그는 상세히
    org.hibernate.SQL: debug          # 하이버네이트가 날리는 SQL 확인
    org.hibernate.type.descriptor.sql: trace # SQL 파라미터 값까지 확인
    org.springframework.web: debug    # 웹 요청 관련 로그
