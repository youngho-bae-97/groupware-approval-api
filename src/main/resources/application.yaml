server:
  tomcat:
    threads:
      # 커넥션 풀 크기 산정의 기준(Tn). 변경 시 hikari.maximum-pool-size 도 함께 조정
      max: 20

spring:
  application:
    name: groupware

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/groupware_db?useUnicode=true&characterEncoding=utf8
    username: gw_user
    #password: ${DB_PASSWORD}
    password: java
    hikari:
      # 커넥션 풀 데드락 방지: Tn × (Cm - 1) + 1 = 20 × (2 - 1) + 1
      # Tn: 동시에 DB를 사용하는 최대 스레드 수 (server.tomcat.threads.max)
      # Cm: 스레드 하나가 동시에 잡는 최대 커넥션 수
      #     (트랜잭션 커넥션 1 + @GeneratedValue 의 *_seq 테이블 채번용 별도 커넥션 1)
      maximum-pool-size: 21

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        naming:
          physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
        #        show_sql: true
        format_sql: true

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 2000

